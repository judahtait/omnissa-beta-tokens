[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnissa-beta-tokens"
version = "0.1.0"
description = "Get Apple beta enrollment tokens for Workspace ONE UEM"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
omnissa-beta-tokens = "omnissa_beta_tokens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
