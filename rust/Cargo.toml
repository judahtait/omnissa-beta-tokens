[package]
name = "omnissa-beta-tokens"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
description = "CLI for Apple beta enrollment tokens (Workspace ONE UEM)"
license = "MIT"
readme = "README.md"

[[bin]]
name = "omnissa-beta-tokens"
path = "src/main.rs"

[[bin]]
name = "build-guide"
path = "src/bin/build-guide.rs"

[[bin]]
name = "make-icns"
path = "src/bin/make-icns.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hmac = "0.12"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
